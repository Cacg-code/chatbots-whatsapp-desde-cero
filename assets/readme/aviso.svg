<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="Aviso: los datos de Meta cambian, verifica siempre en la documentación oficial">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1503"/><stop offset="1" stop-color="#1a0d02"/></linearGradient></defs><style>
.t{font-family:Segoe UI,Helvetica,Arial,sans-serif}.m{font-family:Consolas,Menlo,monospace}
.fl{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bl{animation:bl 1s infinite}.bl2{animation-delay:.2s}.bl3{animation-delay:.4s}@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
.cur{animation:cu 1s steps(2) infinite}@keyframes cu{50%{opacity:0}}
.flow{stroke-dasharray:7 8;animation:d 1.2s linear infinite}@keyframes d{to{stroke-dashoffset:-15}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-out infinite}@keyframes pu{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.4);opacity:0}}
</style>
<style>.stripe{animation:sp 1.6s linear infinite}@keyframes sp{to{transform:translateX(-28px)}}.wi{animation:wi 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes wi{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.cl{}</style>
<defs><clipPath id="top"><rect x="0" y="0" width="1000" height="12"/></clipPath></defs>
<rect width="1000" height="170" rx="22" fill="url(#bg)" stroke="#fb923c" stroke-opacity=".6" stroke-width="2"/>
<g clip-path="url(#top)"><g class="stripe"><path d="M-40 12l12-12h14l-12 12zM-12 12l12-12h14l-12 12zM16 12l12-12h14l-12 12z" fill="#fb923c"/></g></g>
<rect x="0" y="0" width="1000" height="12" fill="none"/>
<text class="t wi" x="70" y="100" text-anchor="middle" font-size="52">⚠️</text>
<g class="t"><text x="130" y="68" font-size="22" font-weight="800" fill="#fdba74">Verifica este dato</text>
<text x="130" y="98" font-size="15" fill="#fed7aa">Precios, límites, menús y versión de la API de Meta cambian con frecuencia.</text>
<text x="130" y="122" font-size="15" fill="#fed7aa">Las lecciones lo marcan y enlazan a la documentación oficial. Todo dato de dinero es INFO REFERENCIAL.</text>
<text x="130" y="148" font-size="13" fill="#c2855a">Este curso no está afiliado a Meta ni a WhatsApp.</text></g>
</svg>
