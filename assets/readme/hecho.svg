<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Pipeline: Markdown, construir.py, sitio estático, probar-ejercicios, revisar.py, GitHub Pages">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1220"/><stop offset="1" stop-color="#0b2a3b"/></linearGradient></defs><style>
.t{font-family:Segoe UI,Helvetica,Arial,sans-serif}.m{font-family:Consolas,Menlo,monospace}
.fl{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bl{animation:bl 1s infinite}.bl2{animation-delay:.2s}.bl3{animation-delay:.4s}@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
.cur{animation:cu 1s steps(2) infinite}@keyframes cu{50%{opacity:0}}
.flow{stroke-dasharray:7 8;animation:d 1.2s linear infinite}@keyframes d{to{stroke-dashoffset:-15}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-out infinite}@keyframes pu{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.4);opacity:0}}
</style>
<rect width="1000" height="230" rx="24" fill="url(#bg)"/>
<path class="flow" d="M150 100H850" stroke="#38bdf8" stroke-width="3" fill="none" stroke-opacity=".7"/>
<g class="t" text-anchor="middle">
<g class="fl"><rect x="30" y="60" width="150" height="90" rx="16" fill="#0a1220" stroke="#38bdf8" stroke-width="2"/><text x="105" y="95" font-size="26">📝</text><text x="105" y="122" font-size="14" font-weight="700" fill="#fff">contenido/*.md</text><text x="105" y="140" font-size="11.5" fill="#7dd3fc">28 lecciones</text></g>
<g class="fl" style="animation-delay:.4s"><rect x="226" y="60" width="150" height="90" rx="16" fill="#0a1220" stroke="#38bdf8" stroke-width="2"/><text x="301" y="95" font-size="26">⚙️</text><text x="301" y="122" font-size="14" font-weight="700" fill="#fff">construir.py</text><text x="301" y="140" font-size="11.5" fill="#7dd3fc">Markdown → HTML</text></g>
<g class="fl" style="animation-delay:.8s"><rect x="422" y="60" width="150" height="90" rx="16" fill="#0a1220" stroke="#38bdf8" stroke-width="2"/><text x="497" y="95" font-size="26">✅</text><text x="497" y="122" font-size="14" font-weight="700" fill="#fff">probar-ejercicios</text><text x="497" y="140" font-size="11.5" fill="#7dd3fc">cada solución válida</text></g>
<g class="fl" style="animation-delay:1.2s"><rect x="618" y="60" width="150" height="90" rx="16" fill="#0a1220" stroke="#38bdf8" stroke-width="2"/><text x="693" y="95" font-size="26">🔎</text><text x="693" y="122" font-size="14" font-weight="700" fill="#fff">revisar.py</text><text x="693" y="140" font-size="11.5" fill="#7dd3fc">enlaces y sitemap</text></g>
<g class="fl" style="animation-delay:1.6s"><rect x="814" y="60" width="156" height="90" rx="16" fill="#0a1220" stroke="#4ade80" stroke-width="2"/><text x="892" y="95" font-size="26">🚀</text><text x="892" y="122" font-size="14" font-weight="700" fill="#fff">GitHub Pages</text><text x="892" y="140" font-size="11.5" fill="#86efac">publicado solo</text></g>
</g>
<circle r="7" fill="#fbbf24"><animateMotion dur="5s" repeatCount="indefinite" path="M105 105H892"/></circle>
<text class="t" x="500" y="205" text-anchor="middle" font-size="14" fill="#7dd3fc">Todo en CI: si algo se rompe, GitHub Actions lo avisa antes de publicar.</text>
</svg>
