<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-label="Aviso importante. Los datos de Meta cambian: verifica siempre">
<defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#08191c"/><stop offset="1" stop-color="#0b3b40"/></linearGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
<clipPath id="cl"><rect x="0" y="100" width="1000" height="6"/></clipPath></defs><style>
.t{font-family:Segoe UI,Helvetica,Arial,sans-serif}.m{font-family:Consolas,Menlo,monospace}
.fl{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bl{animation:bl 1s infinite}.bl2{animation-delay:.2s}.bl3{animation-delay:.4s}@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}
.cur{animation:cu 1s steps(2) infinite}@keyframes cu{50%{opacity:0}}
.flow{stroke-dasharray:7 8;animation:d 1.2s linear infinite}@keyframes d{to{stroke-dashoffset:-15}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-out infinite}@keyframes pu{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.4);opacity:0}}
</style>
<style>.sw{animation:sw 4s ease-in-out infinite}@keyframes sw{0%{transform:translateX(-340px)}100%{transform:translateX(1000px)}}.ic{animation:ic 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ic{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.08)}}</style>
<rect width="1000" height="110" rx="20" fill="url(#bg)"/>
<rect x="0" y="100" width="1000" height="6" fill="#0b2a2e" clip-path="url(#cl)"/>
<g clip-path="url(#cl)"><rect class="sw" x="0" y="100" width="340" height="6" fill="url(#ln)"/></g>
<rect x="24" y="20" width="64" height="64" rx="18" fill="#fb923c" fill-opacity=".2" stroke="#fb923c" stroke-opacity=".7" stroke-width="2"/>
<text class="t ic" x="56" y="64" text-anchor="middle" font-size="34">⚠️</text>
<text class="t" x="110" y="52" font-size="32" font-weight="800" fill="#fff">Aviso importante</text>
<text class="t" x="110" y="80" font-size="16" fill="#99f6e4">Los datos de Meta cambian: verifica siempre</text>
</svg>
