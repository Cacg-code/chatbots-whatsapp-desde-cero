<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Acerca de este material: hecho por un estudiante con IA, sin títulos ni certificados, verifica con la documentación oficial de Meta y avisa de errores"><style>.t{font-family:Segoe UI,Helvetica,Arial,sans-serif}.fl{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.gl{animation:gl 3s ease-in-out infinite}@keyframes gl{0%,100%{opacity:.55}50%{opacity:1}}</style>
