<g class="fl" style="animation-delay:0.6s"><rect x="352" y="26" width="296" height="198" rx="18" fill="#0a1214" stroke="#f59e0b" stroke-opacity=".6"/>
<rect x="392" y="26" width="216" height="4" rx="2" fill="#f59e0b"/>
<circle cx="500" cy="70" r="26" fill="#f59e0b" fill-opacity=".2" stroke="#f59e0b"/><text x="500" y="80" font-size="26">📜</text>
