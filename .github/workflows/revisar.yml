name: Revisar sitio
on:
  push:
    branches: [main]
  pull_request:
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Enlaces, metadatos, sitemap e índice del buscador
        run: python scripts/revisar.py
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Pruebas del bot de referencia
        working-directory: codigo
        run: npm test
      - name: Comprobaciones de los ejercicios (con su solución)
        run: node scripts/probar-ejercicios.mjs
      - name: El sitio está al día con el contenido
        run: |
          pip install markdown
          python scripts/construir.py
          git diff --exit-code --stat -- . ':!assets/indice.json' ':!sitemap.xml' || (echo "Ejecuta python scripts/construir.py y sube los cambios" && exit 1)
